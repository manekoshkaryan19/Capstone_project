services:
  backend:
    build: .
    container_name: capstone_backend
    ports:
      - "8000:8000"
    command: gunicorn --bind 0.0.0.0:8000 app:app --workers 4
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:1904@localhost:5434/trello1
      - SECRET_KEY=${SECRET_KEY}
      # Add other environment variables as needed
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: capstone_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1904
      - POSTGRES_DB=trello1
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: nginx:latest
    container_name: capstone_web
    restart: always
    ports:
      - "8080:80"  # Host port 8081 mapped to container port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
